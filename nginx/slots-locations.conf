# Blue-green only. render-config.sh copies this to conf.d/slots-locations.inc in slots mode and
# locations.conf includes it by glob, so a legacy deploy (or a rollback to an older entrypoint)
# never sees these locations nor the $*_prev variables they use.

# recursive_error_pages on must be set in the location that makes the FIRST redirect (the slots-err-*.inc files
# rendered by render-config.sh, and the turn route below): nginx decides there, with that location's setting,
# whether error_page may apply again inside the named location. Set only in the named location it is ignored.
# The new slot already answered 404 before we asked the previous one. If that one is unreachable (its name no
# longer resolves, or it is gone), the client gets the original 404, never a 502 for a route the new slot said
# it does not have. The new slot's 404 body is not recoverable here; the status is what clients act on.
location @prev_gone_404 {
    internal;
    default_type text/plain;
    return 404 "not found";
}

# Turn status: the new slot said "idle" (as a 404 only because of the fallback header); with the previous slot
# gone there is no live turn to find, so answer the idle shape with 200, the body the API itself gives.
location @prev_gone_idle {
    internal;
    default_type application/json;
    return 200 '{"state":"idle","pendingWatches":0}';
}

location @chat_prev {
    error_page 502 503 504 = @prev_gone_404;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    proxy_pass $inference_prev;
}

location @approvals_prev {
    error_page 502 503 504 = @prev_gone_404;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_prev;
}

location @web_static_prev {
    error_page 502 503 504 = @prev_gone_404;
    proxy_pass $web_prev;
    proxy_http_version 1.1;
    include /etc/nginx/proxy-client-headers.conf;
}

location @site_static_prev {
    error_page 502 503 504 = @prev_gone_404;
    proxy_pass $site_prev;
    proxy_http_version 1.1;
    include /etc/nginx/proxy-client-headers.conf;
}

# Assistant turn status, GET /api/v1/assistant/threads/{id}/turn. A live turn runs in one inference
# process; after a switch it may be the previous slot's, while the new slot answers "idle". The API
# turns an idle answer into a 404 when it sees X-ReelBolt-Slot-Fallback: 1, which sends the request
# to the previous slot (header cleared there, so an idle answer stays a real 200 idle). The header
# is set here, replacing any client value; the regex matches this one route and nothing else.
# Everywhere else proxy-client-headers.conf blanks the header, so a client cannot send it at all.
location ~ ^/api/v1/assistant/threads/[^/]+/turn$ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_set_header X-ReelBolt-Slot-Fallback "1";
    proxy_intercept_errors on;
    recursive_error_pages on;   # needed here: see the note above @prev_gone_404
    error_page 404 = @turn_prev;
    proxy_pass $inference_api;
}

location @turn_prev {
    error_page 502 503 504 = @prev_gone_idle;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_set_header X-ReelBolt-Slot-Fallback "";
    proxy_pass $inference_prev;
}
