server {
    listen 80;
    server_name _;

    set $caddy http://caddy:80;

    # Answers Let's Encrypt's HTTP-01 challenge by forwarding to the `caddy`
    # cert-manager sidecar (docker-compose.yml, `tls` profile; see
    # docs/tls.md).
    #
    # The Host header is load-bearing and must be forwarded explicitly. Caddy
    # matches an incoming challenge to the site it manages BY HOSTNAME, so it
    # only answers while it sees `Host: <DOMAIN>`. nginx's default for
    # proxy_pass is `Host: $proxy_host` — the upstream name, i.e. the bare word
    # `caddy`, which Caddy does not manage. The request then falls through to
    # Caddy's automatic HTTP->HTTPS redirect and Let's Encrypt is handed
    # `https://caddy/.well-known/acme-challenge/<token>`, which it refuses
    # outright: "invalid host: must end in IANA registered TLD".
    #
    # The failure is invisible until renewal. A certificate obtained BEFORE
    # FORCE_HTTPS was switched on keeps working, so the site looks healthy for
    # ~60 days while every renewal silently fails and the cert then expires.
    # http-server-dev.conf has always forwarded these headers; this block must
    # forward them too. See docs/tls.md "Renewals".
    location ^~ /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $caddy;
    }

    # FORCE_HTTPS=true: everything else redirects to https://. Only enable
    # this once a real domain + Caddy-issued certificate is confirmed
    # working on :443 (see docs/tls.md) — flipping it on too early with only
    # a self-signed cert just replaces a working http:// dev flow with a
    # browser warning on every request.
    location / {
        return 301 https://$host$request_uri;
    }
}
