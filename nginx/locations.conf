location = /api/v1/auth/token {
    limit_req zone=auth_public burst=5 nodelay;
    proxy_pass $go_api;
}

# Public, unauthenticated account endpoints: rate limited per client IP (C5). Exact-match
# locations win over the /api/v1/auth/ prefix below. They need no Authorization header.
location = /api/v1/auth/signup {
    limit_req zone=auth_public burst=5 nodelay;
    proxy_pass $go_api;
}

location = /api/v1/auth/forgot-password {
    limit_req zone=auth_public burst=5 nodelay;
    proxy_pass $go_api;
}

location = /api/v1/auth/resend-verification {
    limit_req zone=auth_public burst=5 nodelay;
    proxy_pass $go_api;
}

# Email change links (#1207): the confirmation mail goes to the user's current address and the page
# posts the token from its body. Anonymous by design (the token is the only credential), so any
# Authorization header is blanked; rate limited per client IP like the other public account routes.
# The signed-in cancel (DELETE /api/v1/auth/email-change) keeps the /api/v1/auth/ prefix below.
location ~ ^/api/v1/auth/email-change/(preview|confirm|cancel)$ {
    limit_req zone=auth_public burst=5 nodelay;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# Public marketing-consent endpoints (Inference API, api/v1/marketing). Anonymous by design:
# a site visitor subscribes, and a link in an email confirms or unsubscribes (including the
# RFC 8058 List-Unsubscribe=One-Click POST a mail provider sends on its own). The only credential
# is the signed token in the body or query, so there is no session cookie to translate: any
# client-supplied Authorization header is blanked. Rate limited per client IP like the other
# public account endpoints, and opted out of the staging basic-auth front door because neither a
# mail provider nor a link opened from a mail client can answer a basic-auth challenge. These three
# paths only: the rest of /api/v1/marketing/ (consent, admin export) keeps the catch-all.
#
# Case-insensitive regexes with an optional trailing slash, not exact matches (S-05): ASP.NET
# routes /api/v1/Marketing/Subscribe/ to the same action as /api/v1/marketing/subscribe, and an
# exact match let every such variant fall through to /api/v1/ below, skipping limit_req. A regex
# location wins over the non-^~ /api/v1/ prefix; nginx.conf's site_forward map uses the same
# pattern. The Go API's exact auth_public locations above need no such change: gorilla/mux is
# case-sensitive and does not strip a trailing slash, so their variants 404 at the API.
#
# A proxy_set_header in a location drops EVERY server-level proxy_set_header, so this and every
# other location below that sets one includes proxy-client-headers.conf again: the API records
# the consent click's IP from X-Real-IP, and without it a client could send its own X-Real-IP
# straight through. nginx/tests/forwarded-headers.sh enforces this for new locations. Host is not
# in that snippet: only these three marketing locations and the visit beacon further down set
# `Host $host` themselves; every other location with its own headers sends nginx's default Host.
location ~* ^/api/v1/marketing/subscribe(/|$) {
    # Exactly one of these applies per request (nginx.conf maps the other zone's key to ""):
    # without X-ReelBolt-Site-Token auth_public as before; with it the looser site_forward zone.
    limit_req zone=auth_public burst=5 nodelay;
    limit_req zone=site_forward burst=20 nodelay;
    auth_basic off;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

location ~* ^/api/v1/marketing/confirm(/|$) {
    limit_req zone=auth_public burst=5 nodelay;
    auth_basic off;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

location ~* ^/api/v1/marketing/unsubscribe(/|$) {
    limit_req zone=auth_public burst=5 nodelay;
    auth_basic off;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# Brevo marketing webhooks (delivery/bounce/unsubscribe events). Authenticated by the API through the
# X-ReelBolt-Webhook-Token header, which passes through untouched (no log_format logs request headers).
# Zone: telemetry_ingest (120r/m per address) with a burst for event bursts. Body cap 1m, equal to the API's own
# limit (MarketingBrevoWebhookController.MaxBodyBytes): every event in a body is processed, so the cap is the only bound. Deliberately
# no Host line (nginx/tests/forwarded-headers.sh pins which locations set Host: the three public marketing ones and the visit beacon).
location ~* ^/api/v1/marketing/webhooks/brevo(/|$) {
    limit_req zone=telemetry_ingest burst=60 nodelay;
    client_max_body_size 1m;
    auth_basic off;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# Anonymous promotion reads for the pricing page (Inference API, billing/promotions): the active
# promotions and the plan previews (priced by the active billing provider). Case-insensitive, optional trailing slash, as the
# marketing locations above. Deliberately no Host line: nginx/tests/forwarded-headers.sh pins the
# locations that set Host (the three marketing ones and the visit beacon), so this one sends the
# upstream's default Host.
# Any method is passed through (only GET is meaningful; the API decides).
location ~* ^/api/v1/billing/promotions/(active|plan-prices)(/|$) {
    # Exactly one of these applies per request (nginx.conf maps the other zone's key to ""):
    # without X-ReelBolt-Site-Token promo_public (30r/m per address, sized for page views); with it
    # (the site's server-side proxy) the looser site_forward zone, as for marketing/subscribe.
    limit_req zone=promo_public burst=30 nodelay;
    limit_req zone=site_forward burst=20 nodelay;
    auth_basic off;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# Anonymous output links (Inference API, GET /api/v1/output-links/{token}). The signed token IS the
# authorization and sits in the path, so:
#   - the access log uses output_links_log (nginx.conf), which omits the URI, query and referer, so
#     the token never lands in a log file. (nginx's error log quotes the request line on upstream
#     failures; that one cannot be redacted from here.)
#   - a request refused or delayed by limit_req is logged with its request line too, at `error` by
#     default; limit_req_log_level info puts both below the `warn` threshold of error_log
#     (nginx.conf), so a player over its burst does not write the token to the container log.
#   - no session cookie is translated: Authorization is blanked, not $auth_header.
#   - it opts out of the staging basic-auth front door: a link opened from a chat, an <img>/<video>
#     tag or an MCP client cannot answer a basic-auth challenge, and the token is the credential.
#   - Range requests pass through untouched and the body is streamed unbuffered, so large renders
#     seek and start playing without nginx spooling them to disk.
#   - the output_links zone (per client IP, dedicated: a video player issues many Range requests
#     per view, which auth_public's 5r/m would starve) keeps the route from being hammered.
# Case-insensitive regex, not a ^~ prefix: the Inference API routes case-insensitively (S-05), and a
# case variant would otherwise fall through to /api/v1/ below, logging the token and skipping the limit.
location ~* ^/api/v1/output-links/ {
    limit_req zone=output_links burst=60 nodelay;
    limit_req_log_level info;
    access_log /dev/stdout output_links_log;
    auth_basic off;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
    proxy_pass $inference_api;
}

# Anonymous guest review links (Inference API, /api/v1/review-links/{token}[/media|/comments|/decision]). The
# capability token IS the authorization and sits in the path, so exactly as for output links:
#   - the access log uses review_links_log (nginx.conf): no URI, query or referer, so the token never lands in a log
#     (nginx's error log quotes the request line on upstream failures; that one cannot be redacted from here).
#   - no session cookie is translated: Authorization is blanked, not $auth_header.
#   - it opts out of the staging basic-auth front door: a guest has no credentials and the token is the credential.
#   - Range requests pass through untouched and the body is streamed unbuffered.
#   - reads share the review_links zone (a player issues many Range requests per view); writes (POST only) also
#     pass review_links_write, 10r/m burst 10 per address. Two limit_req lines apply both.
# Case-insensitive regex, not a prefix, for the same reason as output links (S-05).
location ~* ^/api/v1/review-links/ {
    limit_req zone=review_links burst=60 nodelay;
    limit_req zone=review_links_write burst=10 nodelay;
    limit_req_log_level info;   # as for output links: keeps the token out of the error log
    access_log /dev/stdout review_links_log;
    auth_basic off;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
    proxy_pass $inference_api;
}

# Public REST API (Inference API, /api/public/v1/**). Server-to-server: the client sends
# "Authorization: Bearer rbk_..." (an API key) and that is the only credential, so:
#   - Authorization is passed verbatim ($http_authorization), NEVER $auth_header, which would turn a
#     browser session cookie into a bearer token; Cookie is blanked so no cookie reaches this surface.
#   - it opts out of the staging basic-auth front door, which reads the same Authorization header.
#   - the access log uses public_api_log (nginx.conf): no query string and no Authorization header.
#   - public_api is only a coarse per-IP flood guard (600r/m, burst 200); per-key limits live in the app.
#   - small body cap: uploads go straight to object storage via presigned URLs. No CORS headers.
# Case-insensitive regex, not a prefix: the Inference API routes case-insensitively (S-05), and a case
# variant would otherwise skip the log redaction and the limit.
location ~* ^/api/public/ {
    limit_req zone=public_api burst=200 nodelay;
    limit_req_status 429;
    error_page 429 = @public_api_rate_limited;
    access_log /dev/stdout public_api_log;
    auth_basic off;
    client_max_body_size 2m;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_pass $inference_api;
}

# Edge rate-limit answer for /api/public/: the public error envelope with Retry-After. resetsAt is null
# because nginx does not know when the bucket refills; the app's per-key 429s (passed through, since
# proxy_intercept_errors is off) carry the real value. No request-id header is defined at the edge.
location @public_api_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header RateLimit-Reset 60 always;
    include /etc/nginx/security-headers.conf;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Retry later.","resetsAt":null}}';
}

# Anonymous recipe marketplace (Inference API, GET/HEAD /api/v1/public/marketplace/...). Public data, so
# unlike output/review links the normal access log is kept. Authorization and Cookie are blanked toward the
# upstream, the staging basic-auth front door is off, other methods are denied. Anchored on the /public/
# prefix: the authenticated routes live under /api/v1/marketplace/ (no /public/) and keep using /api/v1/.
# The upstream's `Cache-Control: public` is passed through (no proxy_hide_header, no proxy_cache).
# Case-insensitive regex (S-05). The media block comes first: regex locations match in file order.
location ~* ^/api/v1/public/marketplace/recipes/[^/]+/(preview|poster)/?$ {
    limit_req zone=marketplace_media burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    auth_basic off;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
    proxy_pass $inference_api;
}

location ~* ^/api/v1/public/marketplace/ {
    limit_req zone=marketplace_list burst=30 nodelay;
    limit_except GET HEAD { deny all; }
    auth_basic off;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# Anonymous page-visit beacon (Inference API, POST /api/v1/telemetry/visit). No session, no cookie
# translation: Authorization is blanked and the staging basic-auth front door is off for it. Own
# zone (60r/m per client IP), tiny body cap.
#
# A case-insensitive regex with an optional trailing slash, not an exact match (S-05, EDGE-03): the
# Inference API routes /api/v1/Telemetry/Visit/ to the same action, and an exact match let that
# variant fall to the ~* telemetry block below, with its looser zone and without this body cap.
# Declared BEFORE that block: nginx takes the first regex that matches.
#
# `Host $host` is set here on purpose, like the three marketing locations and unlike the other
# locations with headers of their own. The API drops a source label or referrer that is the site's
# own host, and it learns that host from the request's Host. A location that sets any header loses
# the server block's `Host $host`, so without this line the API saw nginx's default (the upstream's
# own name, e.g. inference:8080) and could not recognise a self-referral on any hostname other than
# the configured one. nginx/tests/forwarded-headers.sh pins the list of locations that set Host.
location ~* ^/api/v1/telemetry/visit(/|$) {
    limit_req zone=telemetry_visit burst=20 nodelay;
    client_max_body_size 2k;
    auth_basic off;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# CSP / COEP violation reports (Inference API, POST /api/v1/telemetry/csp-report; docs/csp-reporting.md).
# Sent by the BROWSER, anonymously, from any page: no session, no cookie, no staging basic-auth. The
# answer is ALWAYS an empty 204 (a report is fire-and-forget and an error body is of no use to anyone):
# a rate-limited request (429 -> 204), an oversized body (413), a wrong method, an upstream error or a
# refusal by the API all become the same empty 204 through @csp_report_empty. Own zone (30r/m per
# address, burst 20), 16k body cap. The access log has no query, referer or body (csp_report_log);
# limit_req_log_level info keeps the rejection out of the error log.
#
# A case-insensitive regex with an optional trailing slash, like the visit beacon (S-05, EDGE-03), and
# BEFORE the telemetry ingest regex below (first matching regex wins). Authorization and Cookie are
# blanked: the report is anonymous and the API must never see a session. No Host line (the
# API does not need it); proxy-client-headers.conf is included for the client address.
location ~* ^/api/v1/telemetry/csp-report/?$ {
    limit_req zone=csp_report burst=20 nodelay;
    limit_req_status 429;
    limit_req_log_level info;
    client_max_body_size 16k;
    auth_basic off;
    access_log /dev/stdout csp_report_log;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 413 415 429 500 502 503 504 =204 @csp_report_empty;
    if ($request_method != POST) {
        return 204;
    }
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}
location @csp_report_empty {
    access_log /dev/stdout csp_report_log;
    return 204;
}

# Client telemetry ingest (Inference API, POST /api/v1/telemetry/events and /errors). Authenticated:
# the browser sends its session cookie, which $auth_header turns into the bearer token the API reads
# the user id from, so this is a session route and stays behind the staging basic-auth front door
# (no auth_basic off) exactly as the generic /api/v1/ block below does. The consent branch appends a
# row per request with no at-most-once claim, so the telemetry_ingest zone (nginx.conf, 120r/m per
# address) is the edge bound on that table's growth. Best-effort sends are swallowed on failure, so
# the limit is sized to be invisible to a real user (a handful of events ever) and to a NAT'd office
# sharing one address, while still bounding a script.
#
# Case-insensitive regex, not an exact or prefix match (S-05): the Inference API routes
# case-insensitively, so /api/v1/Telemetry/Events is the same action; a case variant would otherwise
# fall through to /api/v1/ below, skipping limit_req. A regex location wins over the non-^~
# /api/v1/ prefix. Deliberately no Host line: the generic /api/v1/ block sends nginx's default Host,
# so this one does too (only the three marketing locations and the visit beacon above set
# `Host $host`), and nginx/tests/forwarded-headers.sh pins that. proxy_set_header Authorization drops every
# server-level proxy_set_header, so proxy-client-headers.conf is included again to keep the client
# address headers.
location ~* ^/api/v1/telemetry/ {
    limit_req zone=telemetry_ingest burst=60 nodelay;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

location = /api/auth/logout {
    if ($request_method != POST) {
        return 405;
    }
    js_content auth.handleLogout;
}

location /api/v1/auth/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location /api/v1/admin/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# Organizations, memberships and invites (Go API). Plural /orgs is the Go API; the Inference
# API's org-scoped routes use the singular /api/v1/org/... and fall through to the catch-all.
location = /api/v1/orgs {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location /api/v1/orgs/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# Notification preferences and the delivery log (Go API, api/handlers/notifications).
# Without these the catch-all below sent every /api/v1/notifications call to the
# Inference API, which 404s them: Settings -> Notifications never reached the
# handler and the page showed "Could not load your notification settings".
location = /api/v1/notifications {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location /api/v1/notifications/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# Paired machines (Go API, api/handlers/runners). Without these the catch-all below sent every
# /api/v1/runners call to the Inference API, which 404s it: the runners page, device pairing and
# revocation never reached the handler. pair/start, pair/poll and token are public on the Go API
# (a device has no session); the Authorization header is simply empty for them.
location = /api/v1/runners {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location /api/v1/runners/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# The dashboard's global event feed (Go API). Exact match, so it wins over the
# /api/v1/workflows/ prefix right below: there it was buffered and carried nginx's default
# 60 s read timeout, so the browser reconnected on a timer and events could sit in the
# buffer. Only the per-execution SSE regex further down had the unbuffered treatment.
# Authenticated like the prefix (session cookie -> bearer token) and still behind the
# staging basic-auth front door. Keep the timeouts long: an idle feed is not a dead one.
location = /api/v1/workflows/events {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass $go_api;
}

location /api/v1/workflows/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location ~* ^/api/v1/projects/.+/workflows/.+/executions/.+/events/?$ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_pass $go_api;
}

# stop requests are now handled by the Inference API; the earlier
# regex hack routing them to the Go API is no longer needed.
location ~ ^/api/v1/projects/[^/]+/workflows/[^/]+/executions/[^/]+/stop$ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

location = /health {
    # deploy.yml probes this from the VM itself, so it stays reachable when the
    # staging front door (docs/staging.md) is on. It exposes nothing but liveness.
    auth_basic off;
    proxy_pass $go_api;
}

# The engine's admin reads go through the Inference API, which authenticates the caller and
# calls the engine itself (WorkflowEngineProxyController). The engine therefore never has to
# validate a session token and does not hold the session signing key on a render host.
# Only the anonymous liveness probe still goes to the engine directly.
location = /api/v1/workflow-engine/health {
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $workflow_engine;
}

location /api/v1/workflow-engine/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# The sandbox executor is deliberately NOT proxied.
#
# It used to be exposed here with no auth at all (no $auth_header, no
# checks), which made the whole control API reachable from the internet:
# POST a sandbox, PUT a package.json whose "build" script is any shell
# command, POST /exec, and you have unauthenticated remote code execution
# — against a service that holds the Docker socket.
#
# Nothing in the browser calls it. Its only client is the workflow engine,
# which reaches it in-cluster over the reelbolt network with a bearer
# token (Sandbox__ApiToken / SANDBOX_API_TOKEN). It must not be routable
# from outside the cluster; do not add a location block for it.

# The assistant replies over SSE and can stay quiet for a long time while the model runs tools.
# Under the generic /api/v1/ block it was buffered and cut off after nginx's default 60s read
# timeout, which the browser reported as "Error in input stream". Unbuffered, with a long idle
# allowance; the server also sends a heartbeat comment every 15s.
location = /api/v1/assistant/chat {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    # A re-attach ({"attach":true}) to a live turn that runs in the PREVIOUS slot's inference process
    # answers 404 from the new slot, which does not hold the turn; retry it once on the previous slot
    # (same streaming settings). A foreign thread is 404 on both, so the retry changes nothing for it.
    # A normal 200 stream is not an error response and is never intercepted.
    include /etc/nginx/conf.d/slots-err-chat*.inc;
    proxy_pass $inference_api;
}

# Assistant approval cards live in the memory of the inference process that ran the turn. After a
# blue-green switch the card's POST can land on the new slot, which answers 404 for a card it never
# issued; retry it once on the previous slot. The request body is replayed (default request
# buffering is kept on purpose: proxy_request_buffering off would make the retry impossible).
# More assistant routes that hold per-process state are added here as they are found.
location ^~ /api/v1/assistant/approvals/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    include /etc/nginx/conf.d/slots-err-approvals*.inc;
    proxy_pass $inference_api;
}

# Blue-green only: the named fallback locations (@chat_prev, @approvals_prev, @web_static_prev,
# @site_static_prev) the error_page includes above point at, and the assistant turn route's own
# fallback. render-config.sh writes the file in slots mode; a glob with no match is valid, so a
# legacy render has neither the files nor the locations (see nginx/slots-locations.conf).
include /etc/nginx/conf.d/slots-locations*.inc;

# Billing provider webhooks (Paddle; Stripe follows). Server-to-server: there is no session cookie, so this
# block deliberately does NOT use $auth_header (the cookie->Authorization translation), and any
# client-supplied Authorization header is blanked. The only credential is the Paddle-Signature
# HMAC over the raw body, verified by the Inference API; the body is passed through untouched
# (no buffering rewrites) because the signature covers its exact bytes. A webhook is small JSON.
#
# This block, the Stripe one and the GitHub one below are case-insensitive regexes with an optional
# trailing slash, not exact matches (S-05, EDGE-03): the Inference API routes
# /api/v1/billing/webhooks/Paddle/ to the same action, and an exact match let that variant fall
# through to /api/v1/, skipping the body cap and, here, the source-IP allowlist include. The URIs
# these regexes take are a superset of the ones that reach the handlers, which is the safe direction.
location ~* ^/api/v1/billing/webhooks/paddle(/|$) {
    client_max_body_size 1m;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    # Paddle cannot answer a basic-auth challenge, so this location opts out of the
    # staging front door (docs/staging.md). The signature HMAC is the credential.
    auth_basic off;
    # Optional defence in depth (docs/billing.md): restrict this route to Paddle's
    # published source IPs. The file is rendered on every start and refreshed on the
    # entrypoint's reload loop — empty when PADDLE_WEBHOOK_IP_ALLOWLIST is off (the
    # default), `allow <cidr>; … deny all;` when on — and always exists, so this
    # include never dangles.
    include /etc/nginx/conf.d/paddle-webhook-allow.conf;
    proxy_pass $inference_api;
}

# Stripe webhook (Billing:Provider=Stripe, docs/billing.md). Same shape and reasons as the Paddle
# block above: no session cookie, so no $auth_header, any client Authorization is blanked, the raw
# body passes through untouched, and the only credential is the Stripe-Signature HMAC (t=...,v1=...)
# over the raw body, verified by the Inference API. Deliberately NO IP allowlist include:
# signature verification is the control. Optional defence in depth: Stripe publishes its webhook
# source IPs at https://stripe.com/files/ips/ips_webhooks.txt; an operator may add an
# `allow <ip>; ... deny all;` list here (behind Cloudflare, only with the real-IP restore on).
location ~* ^/api/v1/billing/webhooks/stripe(/|$) {
    client_max_body_size 1m;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    # Stripe cannot answer a basic-auth challenge (docs/staging.md); the signature is the credential.
    auth_basic off;
    proxy_pass $inference_api;
}

# GitHub App webhook (docs/github-app.md). Server-to-server, like the Paddle block above and for
# the same reasons: no session cookie exists, so $auth_header is NOT used and any client-supplied
# Authorization header is blanked. The only credential is the X-Hub-Signature-256 HMAC over the
# exact bytes of the body, verified in constant time by the Inference API before it writes
# anything. The body is forwarded untouched (no buffering or rewriting), because the signature
# covers its bytes. GitHub's own limit on a webhook payload is 25 MB, but a push payload is JSON
# prose about commits and the API refuses anything over 2 MB.
location ~* ^/api/v1/github/webhook(/|$) {
    client_max_body_size 2m;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    auth_basic off;
    proxy_pass $inference_api;
}

# Desktop app folder sync (docs/local-folder-sync.md). Called by the ReelBolt desktop app, not a
# browser: there is no session cookie, so $auth_header is NOT used and any client-supplied
# Authorization header is blanked. The ONLY credential is the device's Ed25519 signature over the
# method, the exact path and query, a timestamp, a nonce and the body hash, verified by the
# Inference API. It opts out of the staging basic-auth front door because the desktop app cannot
# answer a basic-auth challenge. Bodies are JSON manifests and upload tickets, at most 4 MiB; the
# file bytes go straight to object storage through presigned URLs and never pass through here.
location /api/v1/device/ {
    client_max_body_size 4m;
    proxy_set_header Authorization "";
    include /etc/nginx/proxy-client-headers.conf;
    auth_basic off;
    proxy_pass $inference_api;
}

# Picture-editor operations and subject cut-outs. The Inference API bounds each at 90 s and answers
# 424 OPERATION_TIMEOUT with a readable body; under the generic /api/v1/ block nginx's default 60 s
# read timeout fired first and returned a bare 504 (which Cloudflare also replaces with its own
# page). 120 s here lets the API's answer arrive. A regex location, so it wins over the plain
# /api/v1/ prefix; no ^~ prefix covers /api/v1/projects/. Otherwise identical to /api/v1/.
location ~ ^/api/v1/projects/[^/]+/image-documents/[^/]+/(operations|subjects)$ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass $inference_api;
}

# Editor AI proposals (recut, graphics, grade, sfx, review). The web asks with ?background=true and
# polls .../proposals/jobs/{id}, so no request waits on the model; the synchronous form (a tab
# loaded before that change) is bounded by the API at 75 s and answers 424 PROPOSAL_TIMEOUT.
# 120 s here lets that answer arrive before nginx's default 60 s turns it into a bare 504 (which
# Cloudflare, cutting at 100 s, would replace anyway). Otherwise identical to /api/v1/.
location ~ ^/api/v1/projects/[^/]+/edit-timelines/[^/]+/proposals$ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass $inference_api;
}

location /api/v1/ {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $inference_api;
}

# Guest review page (Next.js `web`): /app/review/g/{token}. The token is a capability in the path, so
# like the API route it gets its own access log without the URI, query or referer, opts out of the
# staging basic-auth front door (a client opening a shared link has no credentials), and tells the browser
# to send no Referer from this page. ^~ so it beats the plain /app prefix below (longest prefix wins).
location ^~ /app/review/g/ {
    limit_req zone=review_links burst=60 nodelay;
    limit_req_log_level info;   # as for the API route: keeps the token out of the error log
    access_log /dev/stdout review_page_log;
    auth_basic off;
    # A location with an add_header of its own inherits none from the server block. The snippet
    # also sets Referrer-Policy: no-referrer for this path class (the $sh_referrer map).
    include /etc/nginx/security-headers.conf;
    proxy_pass $web_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

# Hashed Next.js chunks. A tab opened before a switch asks for chunks only the previous release
# has; the new slot answers 404, so retry on the previous slot (deploymentId keeps unchanged apps'
# chunk URLs stable, this covers the changed ones).
location ^~ /app/_next/static/ {
    include /etc/nginx/conf.d/slots-err-web_static*.inc;
    proxy_pass $web_app;
    proxy_http_version 1.1;
    include /etc/nginx/proxy-client-headers.conf;
}

location ^~ /_next/static/ {
    include /etc/nginx/conf.d/slots-err-site_static*.inc;
    proxy_pass $site_app;
    proxy_http_version 1.1;
    include /etc/nginx/proxy-client-headers.conf;
}

# Dashboard (Next.js `web`, basePath '/app'). ^~ so it wins over the
# regex locations above without further regex evaluation. proxy_pass
# with a bare variable and no URI part forwards /app/... unchanged,
# which is what a Next app with basePath '/app' expects to receive.
#
# Kept on the variable form deliberately (T-004): this block forwards `Connection: upgrade`
# unconditionally for websocket upgrades, the header that disables upstream connection reuse,
# and a static upstream would also pin the web container's start-up IP.
location ^~ /app {
    proxy_pass $web_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

# Documentation site (Docusaurus, static, baseUrl '/docs/'). Public, no auth — it documents
# the product, not anyone's data. The URI is forwarded unchanged, which is what a site built
# with baseUrl '/docs/' expects. See docs/docs-site.md.
location = /docs {
    return 301 /docs/;
}

location ^~ /docs/ {
    proxy_pass $docs_app;
}

# Tracked links: https://<site>/l/{code} (docs/design/new-user-funnel.md sections 3 and 6). The
# public, short form of the Inference API's anonymous GET /api/v1/l/{code}, which adds one to the
# link's click counter for today and answers a 302 to the landing page with the campaign parameters.
# A posted link has to keep working whatever happens behind it, so the three blocks below never
# leave a visitor on an error page:
#
#   - A well-formed code is proxied. The API itself redirects an unknown or archived code to `/`.
#   - Anything else under /l/ (a code that cannot exist, a deeper path) is redirected to `/` here.
#   - If the API cannot answer (500/502/503/504, or no answer within the timeouts below) or the
#     address is over the limit (429), the visitor is redirected to the home page WITH the link code
#     as utm_content (@link_home). The click is not counted, but the visit still belongs to the link:
#     a URL carrying a link's code as utm_content joins that link (design section 4), so an API
#     restart or a busy shared address costs the click count and not the campaign. The API's own
#     answers pass through untouched, including the 404 it gives while tracked links are switched off.
#
# BOTH paths are served here: the short one and the API's own /api/v1/l/{code}. The API path is the
# one the marketing site's Cloudflare Pages Function calls, and it is public on production. Left on
# the generic /api/v1/ block it had no limit at all, accepted every method and received the session
# cookie, while every request to it is one more click on a counter: the limit below could be walked
# around by typing the longer address. Now the two addresses are one location and behave alike.
#
# Anonymous by design: no session is involved, so Authorization and Cookie are blanked (the API
# keeps a counter, not the person, and no credential or cookie reaches it; the user agent does,
# which is how it tells a link preview or crawler from a click), the staging basic-auth front door
# is off (a link opened from a post, and the Pages Function, have no credentials), and only GET and
# HEAD are accepted. Rate limit: exactly one of the two zones applies per request (nginx.conf):
# link_redirect per address, or link_relay for the site's relay when it proves itself with
# X-ReelBolt-Site-Token. That header is checked at this edge and goes no further. The upstream path
# is written out in proxy_pass, so the query string of the click is not forwarded (the API takes
# none) and $uri stays as requested. These two locations write no access line (access_log off), so no address or user agent of a click is kept.
# No Host line, like the marketplace locations: the API answers a relative Location, so the Host it
# sees does not matter.
#
# Short timeouts: the visitor is waiting on a redirect, and the API's work is one indexed read and
# one upsert. Without them a hung API would hold the click for nginx's default 60 s before the
# fallback; the Pages Function gives up after 3 s for the same reason.
#
# A NAMED capture, not $1: evaluating the zone key runs the regex map behind $client_ip_key
# (nginx.conf), and when one of its regexes matches (it does for every IPv6 client) the positional
# captures are overwritten before proxy_pass reads them: $1 would be bytes of the address. Matched
# case-insensitively with an optional trailing slash so a re-typed or re-cased link still reaches
# the API, which is the one place that decides whether a code exists. The regex is quoted because
# it contains braces, which nginx would otherwise read as the start of the block.
#
# Order matters between the two regex locations: nginx takes the first regex that matches, so the
# well-formed code has to come before the catch-all (nginx/tests/forwarded-headers.sh pins it).
location ~* "^/(?:api/v1/)?l/(?<link_code>[a-z0-9][a-z0-9-]{1,39})/?$" {
    limit_req zone=link_redirect burst=40 nodelay;
    limit_req zone=link_relay burst=400 nodelay;
    limit_except GET HEAD { deny all; }
    auth_basic off;
    # No access line at all: the privacy policy says a click keeps no address and no browser, and the
    # shared analytics log records both. Rate-limit refusals still reach the error log.
    access_log off;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-ReelBolt-Site-Token "";
    include /etc/nginx/proxy-client-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 429 500 502 503 504 = @link_home;
    proxy_pass $inference_api/api/v1/l/$link_code;
}

# Everything else under /l/ or /api/v1/l/, in any letter case: never proxied, never an error page.
# The API would answer the same 302 for a malformed code; answering it here keeps junk off the API.
location ~* ^/(?:api/v1/)?l/ {
    auth_basic off;
    access_log off;
    absolute_redirect off;
    return 302 /;
}

# $link_code is the capture of the location that sent the request here, so it is always a
# well-formed code (possibly re-cased as typed; the site lowercases utm_content when it reads it).
location @link_home {
    auth_basic off;
    absolute_redirect off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
    return 302 /?utm_content=$link_code;
}

# The marketing site's own routes (Next.js route handlers, served by the `site` container):
# POST /api/contact, POST /api/subscribe and GET /api/promotions. They sit outside /api/v1/, so
# before these blocks they fell through to `location /` and carried no origin-side per-address
# limit at all. See docs/marketing-site.md step 9 and "Same-origin routes".
#
# Case-insensitive regexes with an optional trailing slash, so every URI nginx normalises into one
# of these paths is limited: /api/contact/, /API/Contact, /api//contact, %-encoded and dot-segment
# variants all land here instead of falling through to `location /`. Next.js matches these routes
# more narrowly than that (it answers /api/contact/ and /api\contact with a 308 to /api/contact, and
# /api/%63ontact with 404, so the handler never runs on those), which is why the regex is the safe
# direction and an exact-match location is not used: the URIs nginx limits are a superset of the
# ones that reach the handlers. The regex wins over the `location /` prefix below; /api/v1/... is
# not matched by it.
#
# The proxy directives are copied from `location /` so the upstream-visible request is unchanged
# apart from the limit: no Host line (so the upstream keeps nginx's default Host, exactly as
# `location /` sends it), and no auth_basic line (so the staging front door still applies, as it
# does on `location /`).
location ~* ^/api/contact(/|$) {
    limit_req zone=site_forms burst=4 nodelay;
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

location ~* ^/api/subscribe(/|$) {
    limit_req zone=site_forms burst=4 nodelay;
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

location ~* ^/api/promotions(/|$) {
    limit_req zone=site_promotions burst=100 nodelay;
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

# The marketing home page, the ONLY URL that picks a language for the visitor: the `rb_locale`
# cookie (set by the footer language switcher), else Accept-Language, else English (nginx/i18n.js,
# one picker, vendored byte-identically). A non-English pick is a 302 (never 301: the
# answer depends on the visitor) that is private and uncacheable; the English answer is the site's
# page with `Vary` so a shared cache cannot hand it to a visitor who should have been redirected.
# Deep links are never redirected, so /it/... cannot loop. The directives below `if` are copied from
# `location /` (no Host line, no auth_basic line), as the marketing locations above do.
location = / {
    absolute_redirect off;
    if ($i18n_home_target != "") {
        add_header Cache-Control "private, no-store" always;
        add_header Vary "Accept-Language, Cookie" always;
        include /etc/nginx/security-headers.conf;
        return 302 $i18n_home_target;
    }
    add_header Vary "Accept-Language, Cookie" always;
    include /etc/nginx/security-headers.conf;
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

# Public marketing site.
location / {
    proxy_pass $site_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy-client-headers.conf;
}

# =============================================================================
#  OBJECT STORAGE -- MOVED TO CLOUDFLARE R2 (2026-10-09)
# =============================================================================
#
#  A block used to live here:
#
#      location /reelforge/ { proxy_pass http://garage:3900; }
#
#  proxying the object-storage bucket through the front door so that presigned
#  URLs named this origin rather than an address the client cannot reach.
#
#  It is removed, not merely redundant, and the second reason is the important
#  one:
#
#    1. Storage is Cloudflare R2 now and presigned URLs are signed for the R2
#       host, so nothing generates a URL under this origin any more.
#
#    2. It took the WHOLE SITE DOWN. nginx resolves a proxy_pass hostname while
#       it parses the configuration, so as soon as Garage left the compose
#       network -- it is pinned to the cloud-disabled profile, because storage
#       moved -- the directive became
#
#           [emerg] host not found in upstream "garage"
#
#       and nginx refused to start at all. Not just the storage path: every
#       route on the box, including /health, went dark. A proxy_pass to a
#       service that can be absent is a landmine, so if it ever comes back it
#       must use a variable (caddy is proxied that way for exactly this
#       reason) or point at DNS the resolver can fail on at request time.
#
#  If the bucket is ever served from this origin again, note that the SigV4
#  signature covers the Host header AND the canonical URI, so a path-prefix
#  proxy cannot work: forward the path UNCHANGED (no URI part on proxy_pass)
#  and preserve $http_host. See docs/cloud-storage.md.
# =============================================================================

# =============================================================================
# MCP OAuth surface (docs/design/mcp-oauth.md §8)
#
# The MCP server is published at this origin so an MCP client can authenticate
# with OAuth instead of being handed a pasted token. These blocks are the ONLY
# public routes that surface gets.
#
# This deliberately supersedes the older "the MCP server is not proxied by nginx"
# rule. That rule still describes the local/stdio mode, which is unchanged.
#
# Which endpoints opt out of the staging basic-auth front door (docs/staging.md)
# is a deliberate split, not an oversight:
#   * discovery + register/token/revoke are called by a MACHINE that has no
#     credential yet and cannot answer a basic-auth challenge — the same reason
#     the Paddle and Stripe webhooks opt out. They authenticate themselves (PKCE, code,
#     client match), so opting out grants nothing.
#   * /oauth/authorize is a BROWSER navigation with a human present, so it stays
#     behind the front door like every other interactive route.
# =============================================================================

# RFC 8414 — the authorization server's own metadata (served by the Go API).
location = /.well-known/oauth-authorization-server {
    auth_basic off;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# RFC 9728 — protected-resource metadata (served by the MCP server), which points
# a client at the issuer above.
#
# Deliberately a PREFIX match, not an exact one. RFC 9728 §3 builds the metadata
# URL by inserting the well-known string between the host and the resource's path
# components, so a strict client that ignores the `resource_metadata` link in the
# 401 challenge asks for `/.well-known/oauth-protected-resource/mcp` when the
# resource is `/mcp`. Serving only the exact root path 404s that client and it can
# never start a login. The MCP server answers both forms.
#
# GET (and HEAD) only. The MCP server serves this document on GET alone; any other method
# on any path falls through to its streamable-HTTP transport, which would make this prefix
# a second door to /mcp without that location's zone and body cap (EDGE-02).
#
# GET itself reaches the MCP server on every path under this prefix, so it carries the /mcp
# zone and body cap too: a GET flood (or a large GET body) on a suffixed path is held to the
# same numbers as /mcp, not to the server-wide defaults.
location /.well-known/oauth-protected-resource {
    limit_except GET { deny all; }
    limit_req zone=mcp burst=200 nodelay;
    client_max_body_size 1m;
    auth_basic off;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $mcp;
}

# Machine-called authorization-server endpoints.
location = /oauth/token {
    auth_basic off;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location = /oauth/revoke {
    auth_basic off;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

location = /oauth/register {
    auth_basic off;
    # Dynamic client registration is necessarily unauthenticated (a client has no
    # credential yet), and it writes a row per call with nothing deleting them, so it
    # is rate-limited through the shared auth_public zone rather than left open. A
    # registration grants no privilege - this is about the table not growing unbounded.
    limit_req zone=auth_public burst=5 nodelay;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# Browser-driven: the consent screen, reached with the session cookie, which
# $auth_header translates into a bearer token for the Go API.
location = /oauth/authorize {
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_pass $go_api;
}

# The MCP endpoint itself. The request URI is forwarded UNCHANGED (the variable
# form of proxy_pass does no prefix rewriting), so the server sees "/mcp"; its
# streamable-HTTP transport accepts any path by design and needs no new route.
#
# Any `Bearer` value gets as far as the transport (it never verifies the token itself), so this
# location carries the edge half of its flood guard (EDGE-02): the mcp zone (nginx.conf, 600r/m
# per address with burst=200, the same coarse guard as /api/public/) and a 1m body cap. A tool
# call is a small JSON-RPC document; uploads never travel through MCP. The transport enforces
# its own session and body caps behind this (mcp/src/httpTransport.ts).
location /mcp {
    limit_req zone=mcp burst=200 nodelay;
    client_max_body_size 1m;
    proxy_set_header Authorization $auth_header;
    include /etc/nginx/proxy-client-headers.conf;
    proxy_http_version 1.1;
    # Server-sent events and long tool calls: let the transport's own keepalives
    # be the liveness signal rather than nginx's default 60s read timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass $mcp;
}
