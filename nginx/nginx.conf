load_module modules/ngx_http_js_module.so;

# Blue-green only (render-config.sh writes it when slots mode is on; a glob with no match is valid, so
# a legacy deploy or a rollback to an older entrypoint never needs the file). A reload (every 12 h,
# and on each switch) leaves the old workers running until their connections end. Chat turns can
# stream for 30 min, so it allows 45 min, then closes the stragglers instead of leaking workers.
include /etc/nginx/conf.d/slots-main*.conf;

# The one variable the nginx process itself reads from its environment (the entrypoint reads the
# others, to render files), and only in auth.js (siteRelayVerified): the marketing site's relay
# token, which decides the rate-limit zone of a tracked-link click the site relays (see the
# link_relay zone below). nginx drops every inherited variable except TZ unless it is named here.
# Unset or empty (the default) means no request is ever treated as a relay; it needs to be set on
# this container only where the marketing site's Cloudflare Pages Function relays clicks here.
env SITE_FORWARD_TOKEN;

# Explicit: /var/log/nginx is a named volume (persistent access logs), which hides the image's
# error.log -> stderr symlink. Errors stay on stderr (docker logs).
error_log /dev/stderr warn;

events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    js_import auth from /etc/nginx/auth.js;
    js_set $auth_header auth.getAuthHeader;

    # Language of `GET /` (the marketing home page only): empty = stay on English, else the
    # redirect target. See nginx/i18n.js and docs/i18n.md.
    js_import i18n from /etc/nginx/i18n.js;
    js_set $i18n_home_target i18n.homeTarget;

    # Origin-side compression (T-004). Cloudflare already compresses to the browser, but the
    # origin->edge leg and the origin CPU were paid every time: /api/v1/.../files is 78 KB,
    # .../outputs 55 KB and .../github/repositories 75 KB of JSON. gzip_proxied any covers
    # responses fetched through the proxy (all of them on this box). text/event-stream is
    # deliberately NOT in gzip_types: the SSE feed must stay unbuffered and un-chunked, and
    # text/html is always compressed by default (not part of gzip_types).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/css text/plain application/javascript application/xml image/svg+xml;

    # Both files below are (re)generated by docker-entrypoint.sh on every
    # container start: http-server.conf is a straight copy of either
    # http-server-dev.conf or http-server-redirect.conf depending on
    # FORCE_HTTPS, and https-server.conf is https-server.conf.template with
    # SSL_CERT/SSL_KEY substituted in. See docs/tls.md.
    # Websocket upgrade helper for runner-server.conf (empty "" when not an upgrade).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # --- Browser security headers (security-headers.conf is the snippet that emits them) -----------
    # $sh_class: the path class of the request; every per-path header value below is keyed on it.
    # Regex maps take the FIRST match in file order, so the more specific classes come first.
    #   review      guest review page (capability token in the path)
    #   app_static  /app/_next/static   site_static  /_next/static (hashed, public chunks)
    #   app         the dashboard
    #   link_api    output-links / review-links media and JSON (capability token in the path)
    #   link        tracked short links /l/ and /api/v1/l/
    #   public_api  /api/v1/public/ (marketplace previews, public by design)
    #   oauth       /oauth/ (the consent page sets its own Referrer-Policy and CSP)
    #   api         every other API route
    #   public_asset  brand, blog images, favicons, social-preview images: fetched cross-origin on purpose
    #   machine     /health, /mcp, /.well-known, /runner: no document, nothing to frame or embed
    #   doc         Docusaurus under /docs        site  everything else (the marketing site)
    map $uri $sh_class {
        ~^/app/review/g/                          review;
        ~^/app/_next/static/                      app_static;
        ~^/_next/static/                          site_static;
        ~^/app(/|$)                               app;
        ~*^/api/v1/(output-links|review-links)/   link_api;
        ~*^/(api/v1/)?l/                          link;
        ~*^/api/v1/public/                        public_api;
        ~^/oauth/                                 oauth;
        ~^/api/                                   api;
        ~^/(brand/|blog/img/|favicon|apple-touch-icon|icon\.|opengraph-image|twitter-image|og/)  public_asset;
        ~^/(health$|mcp|\.well-known/|runner/)    machine;
        ~^/docs(/|$)                              doc;
        default                                   site;
    }

    # Referrer: the review page, its API and the OAuth pages carry a credential in the URL.
    map $sh_class $sh_referrer {
        review    "no-referrer";
        link_api  "no-referrer";
        oauth     "no-referrer";
        default   "strict-origin-when-cross-origin";
    }

    # Permissions-Policy. The dashboard records voice-over (microphone, audio only: no camera) and
    # opens the Paddle checkout (payment). Everything else asks for nothing.
    map $sh_class $sh_permissions {
        app       'camera=(), microphone=(self), geolocation=(), payment=(self "https://*.paddle.com")';
        review    'camera=(), microphone=(self), geolocation=(), payment=(self "https://*.paddle.com")';
        default   "camera=(), microphone=(), geolocation=(), payment=()";
    }

    # Content-Security-Policy-Report-Only and COEP-Report-Only: documents only. $sh_csp_storage is
    # empty or " https://<storage host>" (the deployment's R2/S3 origin, rendered from
    # MINIO_PUBLIC_ENDPOINT into conf.d/security-storage.map); it follows the sources it extends.
    # No upgrade-insecure-requests: plain-http (local, e2e) installs would break.
    # Rendered file, included by glob INSIDE the map: nginx is reloaded (not recycled) at a deploy, so for
    # one reload the OLD render-config.sh runs against this nginx.conf and never writes the file. No match
    # is valid, and an unmatched map without a default is the empty string, which is the right value.
    map $uri $sh_csp_storage {
        include /etc/nginx/conf.d/security-storage*.map;
    }

    map $uri $sh_csp_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.paddle.com https://challenges.cloudflare.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://cdn.reelbolt.ai$sh_csp_storage; connect-src 'self' blob:$sh_csp_storage https://*.google-analytics.com https://*.analytics.google.com https://*.paddle.com https://challenges.cloudflare.com; frame-src https://*.paddle.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/telemetry/csp-report; report-to csp-endpoint";
    }
    map $sh_class $sh_csp_report_only {
        site     $sh_csp_policy;
        doc      $sh_csp_policy;
        app      $sh_csp_policy;
        review   $sh_csp_policy;
        default  "";
    }
    map $sh_class $sh_coep_report_only {
        site     'credentialless; report-to="csp-endpoint"';
        doc      'credentialless; report-to="csp-endpoint"';
        app      'credentialless; report-to="csp-endpoint"';
        review   'credentialless; report-to="csp-endpoint"';
        default  "";
    }
    # Where the two report-only headers send their violation reports: the API's anonymous endpoint,
    # a same-origin relative URL (docs/csp-reporting.md). Emitted on exactly the classes that carry a policy.
    map $sh_class $sh_reporting_endpoints {
        site     'csp-endpoint="/api/v1/telemetry/csp-report"';
        doc      'csp-endpoint="/api/v1/telemetry/csp-report"';
        app      'csp-endpoint="/api/v1/telemetry/csp-report"';
        review   'csp-endpoint="/api/v1/telemetry/csp-report"';
        default  "";
    }
    # COOP on documents. The dashboard opens popups (OAuth sign-in, checkout) and must keep their opener.
    map $sh_class $sh_coop {
        site     "same-origin";
        doc      "same-origin";
        app      "same-origin-allow-popups";
        review   "same-origin-allow-popups";
        default  "";
    }
    # CORP: same-origin unless the path is public by design (embeds, link previews, CDN caches).
    map $sh_class $sh_corp {
        link_api      "cross-origin";
        link          "cross-origin";
        public_api    "cross-origin";
        public_asset  "cross-origin";
        site_static   "cross-origin";
        app_static    "cross-origin";
        default       "same-origin";
    }

    # The upstream's own copies of every header nginx now owns (security-headers.conf), so a response
    # never carries one twice. The Content-Security-Policy is NOT hidden: the API sets its own on file
    # responses. These live at http level and no location sets a proxy_hide_header of its own (a
    # scope that did would drop this inherited list, as with X-ReelBolt-Uid below).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy-Report-Only;
    proxy_hide_header Reporting-Endpoints;

    # realip.conf is empty unless REAL_IP_FROM_CLOUDFLARE=true; runner-server.conf is
    # empty unless UPSTREAM_RUNNER_GATEWAY is set. Both are written by the entrypoint.
    include /etc/nginx/conf.d/realip.conf;

    # Coarse abuse layer for the public account endpoints (C5). Keyed on the client address
    # AFTER realip.conf, so behind Cloudflare it is the visitor's IP, not a Cloudflare edge's.
    # The Go API adds the exact per-email and per-IP signup caps on top (counted in the database).
    #
    # One exception, POST /api/v1/marketing/subscribe forwarded by the marketing site's server:
    # those arrive from one or a few addresses, so 5r/m per
    # address would throttle every visitor together. They carry X-ReelBolt-Site-Token and go to
    # the looser site_forward zone instead (60r/m per address); they are still limited, never
    # exempt. Each zone gets an empty key (= zone skipped) for the requests the other one owns:
    #   no header, any location       -> auth_public  (exactly as before, shared with login etc.)
    #   header,    subscribe location -> site_forward
    #   header,    any other location -> auth_public  (the header changes nothing there)
    # nginx cannot verify the token, and does not try: the Inference API is the authority (it
    # compares the token in fixed time and re-limits per trusted client IP, mailbox, domain and
    # globally). A forged header therefore only moves a caller from the 5r/m zone into the 60r/m
    # outer zone for this one location; it never bypasses the API's limits.
    #
    # The subscribe match is a case-insensitive regex with an optional trailing slash, the same
    # one as the subscribe location (S-05): the Inference API routes case-insensitively and
    # tolerates a trailing slash, so every variant is the same action and must hit the same zone.
    #
    # Per-IP key (N-04), shared by every per-IP zone below: an IPv4 client is keyed on its
    # address, an IPv6 client on its /64. One subscriber line usually gets a whole /64 (often a
    # /56 or /48), so a /128 key let one host rotate through 2^64 fresh buckets. The map works on
    # $binary_remote_addr (4 bytes for IPv4, 16 for IPv6, after realip.conf), where the /64 is
    # simply the first 8 bytes: no textual IPv6 parsing (`::` compression) involved. (?s) lets `.`
    # match any byte; \A and \z anchor the exact length. IPv4-mapped addresses (::ffff:a.b.c.d)
    # all share one /64, so they keep the full 16 bytes, i.e. a per-IPv4-address key. Keys of
    # different families never collide: limit_req compares length as well as bytes.
    map $binary_remote_addr $client_ip_key {
        "~(?s)\A\x00{10}\xff\xff.{4}\z"          $binary_remote_addr;
        "~(?s)\A(?<client_ipv6_net64>.{8}).{8}\z" $client_ipv6_net64;
        default                                  $binary_remote_addr;
    }
    map $http_x_reelbolt_site_token $site_forward_request {
        ""      0;
        default 1;
    }
    map "$site_forward_request$uri" $auth_public_key {
        "~*^1/api/v1/marketing/subscribe(/|$)" "";
        default                                $client_ip_key;
    }
    map "$site_forward_request$uri" $site_forward_key {
        "~*^1/api/v1/marketing/subscribe(/|$)" $client_ip_key;
        "~*^1/api/v1/billing/promotions/(active|plan-prices)(/|$)" $client_ip_key;
        default                                "";
    }
    # Anonymous pricing-page reads of /api/v1/billing/promotions/{active,plan-prices}: the
    # promo_public zone (30r/m per address, sized for page views, so auth_public's 5r/m does not
    # starve them) applies only WITHOUT the site token. With the token the key is "" and the
    # location's site_forward zone (keyed above) applies instead. Exactly one zone per request.
    map "$site_forward_request$uri" $promo_public_key {
        "~*^0/api/v1/billing/promotions/(active|plan-prices)(/|$)" $client_ip_key;
        default                                                    "";
    }
    # e2e/scripts/up-isolated.sh rewrites this exact auth_public line; keep its text stable.
    limit_req_zone $auth_public_key zone=auth_public:10m rate=5r/m;
    limit_req_zone $site_forward_key zone=site_forward:10m rate=60r/m;
    # Anonymous promotions reads from the pricing page (locations.conf). Keyed on $promo_public_key
    # rather than $client_ip_key so that a request carrying the site token never uses this zone.
    limit_req_zone $promo_public_key zone=promo_public:10m rate=30r/m;
    # The runner hostname's public crash-report ingest (runner-server.conf.template). The
    # gateway rate limits per address again behind this; this zone just keeps a flood off it.
    limit_req_zone $client_ip_key zone=runner_telemetry:10m rate=20r/m;
    # Anonymous output links (locations.conf): 120r/m per address, sized for a media player's
    # Range requests; the location adds burst=60. Keyed on $client_ip_key like the zones above.
    limit_req_zone $client_ip_key zone=output_links:10m rate=120r/m;
    # Anonymous guest review links (locations.conf, /api/v1/review-links/{token}): reads (the page data and the
    # video's Range requests) share a 120r/m zone per address like output links; writes (POST comments and
    # decisions) are keyed ONLY on POST, an empty key being exempt from limit_req, at 10r/m with burst=10.
    map $request_method $review_write_key {
        default "";
        POST    $client_ip_key;
    }
    limit_req_zone $client_ip_key zone=review_links:10m rate=120r/m;
    limit_req_zone $review_write_key zone=review_links_write:10m rate=10r/m;
    # Anonymous recipe marketplace (locations.conf, /api/v1/public/marketplace/, GET and HEAD only; default off in
    # the API). List/detail/facets reads get 60r/m per address (burst=30 in the location); the preview and poster
    # media (a player's Range requests) get 120r/m (burst=60). Keyed on $client_ip_key (IPv6 /64). Recipe ids are
    # public, so the normal access log is kept (no URI-less log format).
    limit_req_zone $client_ip_key zone=marketplace_list:10m rate=60r/m;
    limit_req_zone $client_ip_key zone=marketplace_media:10m rate=120r/m;
    # Authenticated client telemetry ingest (locations.conf): POST /api/v1/telemetry/{events,errors}
    # from the browser. 120r/m (2/s) per address with burst=60 in the location. Every send is
    # best-effort and swallowed on failure, so an over-tight limit would cost funnel data rather
    # than function; many people can share one NAT'd address. A real user sends a handful of events
    # ever (first run, first export, a consent decision, the odd error report) and never sees this,
    # while one address is bounded to ~172k requests/day -- enough to keep the consent branch's
    # append-per-request path (Security finding 2) from growing the table without bound. Keyed on
    # $client_ip_key like the other per-IP zones, never on a header a direct client could forge.
    limit_req_zone $client_ip_key zone=telemetry_ingest:10m rate=120r/m;
    # The marketing site's own routes (locations.conf): POST /api/contact, POST /api/subscribe and
    # GET /api/promotions. They are not under /api/v1/, so they are served by the `site` container.
    # The two POST routes carry their own 5-per-10-minute in-memory limiter, which is per-instance
    # and resets on restart; /api/promotions has none at all. These zones are the first real
    # per-address limit for all three. Keyed on $client_ip_key like every other per-IP zone here
    # (IPv4 address, IPv6 /64, after realip.conf) -- never on a header, which a direct client could
    # forge, and never on the Host, so no hostname bypasses it. See docs/marketing-site.md step 9.
    #
    # rate=1r/m burst=4: limit_req takes an integer r/s or r/m only, so the 5-requests-per-600-
    # seconds of the Cloudflare rule this stands in for has no exact nginx form; 1r/m is the
    # slowest rate nginx can express and is the closest to it. burst=4 lets the same five requests
    # through and answers the sixth 429, which is what the alpha gate's A23 row measured.
    limit_req_zone $client_ip_key zone=site_forms:10m rate=1r/m;
    # The read-only promotions proxy needs room, not spam control: the promo banner fetches it once
    # per page load, so a tight limit would empty the banner for ordinary visitors behind one
    # address. 100r/m is the rule docs/marketing-site.md step 9 specifies for it, and is exact.
    # Not to be confused with promo_public above: that zone covers the pricing page's own reads of
    # the API path /api/v1/billing/promotions/{active,plan-prices}, this one the site's proxy of it.
    limit_req_zone $client_ip_key zone=site_promotions:10m rate=100r/m;
    # Access log for /api/v1/output-links/: the token is the URL path, so no URI, query or referer.
    log_format output_links_log '$remote_addr [$time_local] "$request_method /api/v1/output-links/-" '
                                '$status $body_bytes_sent $request_time';
    # Same for /api/v1/review-links/: the token is the URL path (a capability URL), so no URI, query or referer.
    log_format review_links_log '$remote_addr [$time_local] "$request_method /api/v1/review-links/-" '
                                '$status $body_bytes_sent $request_time';
    # Public REST API /api/public/: coarse per-IP flood guard (per-key limits are in the app).
    limit_req_zone $client_ip_key zone=public_api:10m rate=600r/m;
    # The MCP endpoint /mcp (locations.conf): the same coarse per-IP flood guard. The transport never
    # verifies the bearer token itself, so without this any client could open sessions or post bodies
    # at will. Sized to be invisible to MCP clients, including a hosted one whose users share a few
    # egress addresses; the per-session and per-address caps live in the MCP server.
    limit_req_zone $client_ip_key zone=mcp:10m rate=600r/m;
    # Access log for /api/public/: path only ($uri), never the query string or the Authorization header.
    log_format public_api_log '$remote_addr [$time_local] "$request_method $uri" '
                              '$status $body_bytes_sent $request_time';
    # And for the guest review PAGE /app/review/g/{token}: the token is in the path there too.
    log_format review_page_log '$remote_addr [$time_local] "$request_method /app/review/g/-" '
                               '$status $body_bytes_sent $request_time';
    limit_req_zone $client_ip_key zone=telemetry_visit:10m rate=60r/m;
    # CSP/COEP violation reports (locations.conf, POST /api/v1/telemetry/csp-report): a browser sends a burst on
    # a page load, so 30r/m per address with burst=20 in the location. Own log format: path only, never the
    # query, the referer or the user agent (a report body carries page URLs; the log never sees it).
    limit_req_zone $client_ip_key zone=csp_report:10m rate=30r/m;
    log_format csp_report_log '$remote_addr [$time_local] "$request_method $uri" '
                              '$status $body_bytes_sent $request_time';
    # Tracked links (locations.conf, /l/{code} -> the Inference API's GET /api/v1/l/{code}, which counts the
    # click and answers the 302 to the landing page). 120r/m per address, burst=40 in the location: one click is
    # one request, so a person never meets it, while a link shown to a room behind one NAT (a QR code on a
    # slide) gets 40 at once and 2 a second after that. Past the limit the location redirects to the home page
    # instead of answering 429: the click is not counted, and nobody is left on an error page. Keyed on
    # $client_ip_key (IPv4 address, IPv6 /64) like every per-IP zone here, through $link_redirect_key
    # (below). The link code is public (it is posted on purpose), so these requests stay in the normal
    # access log with their path.
    #
    # The API's own path, /api/v1/l/{code}, is served by the SAME location and so by the same limit: it
    # is the route the short path maps to, and left on the generic /api/v1/ block it was a way to add
    # to a link's click counter at any rate from one address.
    #
    # One caller reaches that path on behalf of many visitors: the marketing site's Cloudflare Pages
    # Function for /l/{code} (site/functions/l/[code].ts), whose requests arrive from Cloudflare
    # egress addresses, so 120r/m per address would count them all as one client and send real
    # clicks home uncounted on a busy day. A request that PROVES it is that relay, by carrying
    # X-ReelBolt-Site-Token equal to this container's SITE_FORWARD_TOKEN, uses link_relay instead:
    # 1200r/m per relaying address, burst=400 (20 clicks a second sustained from one egress address,
    # far above what a posted link sends; still a limit, never an exemption). Exactly one of the two
    # zones applies per request (the other one's key is ""):
    #   no header, a wrong token, or SITE_FORWARD_TOKEN unset here -> link_redirect, per address
    #   the right token                                             -> link_relay,    per address
    #
    # Unlike the site_forward zone above, the token IS checked here (auth.js, fixed-time compare):
    # the Inference API keeps a counter on this route and no per-caller limit of its own, so an
    # unchecked header would simply be the way around link_redirect. The per-visitor limit of the
    # relayed path is Cloudflare's, at the Pages edge, where the visitor's address is known
    # (infra/cloudflare/rate-limit.links.<plan>.rules.json, a rate-limit rule on /l/*); the relay
    # sends no visitor address here.
    # The map keeps njs out of every request without the header (a map value is evaluated only when
    # its line matches, and a map result is computed once per request).
    js_set $site_relay_token_ok auth.siteRelayVerified;
    map $http_x_reelbolt_site_token $site_relay_verified {
        ""      "";
        default $site_relay_token_ok;
    }
    map $site_relay_verified $link_redirect_key {
        "1"     "";
        default $client_ip_key;
    }
    map $site_relay_verified $link_relay_key {
        "1"     $client_ip_key;
        default "";
    }
    limit_req_zone $link_redirect_key zone=link_redirect:10m rate=120r/m;
    limit_req_zone $link_relay_key zone=link_relay:10m rate=1200r/m;
    # Persistent product-analytics access log (named volume nginx_logs at /var/log/nginx), one file
    # per day, JSON per line. $uri only: never $request/$args (OAuth codes and reset tokens live in
    # query strings). Referrer is reduced to host+path. remote_addr is post-realip.
    map $time_iso8601 $log_day {
        ~^(\d\d\d\d-\d\d-\d\d) $1;
        default unknown;
    }
    # Query strings and fragments never reach the log: $uri has none, and the referrer map cuts at ? or #.
    map $http_referer $log_referer {
        ~^[a-zA-Z]+://([^?#]*) $1;
        default "";
    }
    # Capability tokens in the PATH are redacted to "-". Single list: nginx/tests/log-redaction.sh
    # asserts every path-token route is covered; keep both in step. $1-$2 = prefix, "-", rest.
    map $uri $log_uri_safe {
        ~*^((?:/app)?/invite/)[^/]+(.*)$ "$1-$2";
        ~*^((?:/app)?/api/v1/auth/invitations/)[^/]+(.*)$ "$1-$2";
        ~*^((?:/app)?/api/v1/output-links/)[^/]+(.*)$ "$1-$2";
        ~*^((?:/app)?/api/v1/review-links/)[^/]+(.*)$ "$1-$2";
        ~*^((?:/app)?/review/g/)[^/]+(.*)$ "$1-$2";
        ~*^((?:/app)?/api/v1/runners/pair/)(?!(?:start|poll)(?:/|$))[^/]+(.*)$ "$1-$2";
        default $uri;
    }
    map $log_referer $log_referer_safe {
        ~*^([^/]*(?:/app)?/invite/)[^/]+(.*)$ "$1-$2";
        ~*^([^/]*(?:/app)?/api/v1/auth/invitations/)[^/]+(.*)$ "$1-$2";
        ~*^([^/]*(?:/app)?/api/v1/output-links/)[^/]+(.*)$ "$1-$2";
        ~*^([^/]*(?:/app)?/api/v1/review-links/)[^/]+(.*)$ "$1-$2";
        ~*^([^/]*(?:/app)?/review/g/)[^/]+(.*)$ "$1-$2";
        ~*^([^/]*(?:/app)?/api/v1/runners/pair/)(?!(?:start|poll)(?:/|$))[^/]+(.*)$ "$1-$2";
        default $log_referer;
    }
    log_format analytics escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$log_uri_safe","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"referrer":"$log_referer_safe","user_agent":"$http_user_agent","upstream_status":"$upstream_status",'
        '"uid":"$upstream_http_x_reelbolt_uid"}';
    # uid: the authenticated user id the Go API puts in X-ReelBolt-Uid (middleware.UserIDHeader;
    # empty for anonymous requests and other upstreams). Logged, never forwarded to the client.
    # http level so every proxying location inherits it; a location that sets its own
    # proxy_hide_header must repeat this line.
    proxy_hide_header X-ReelBolt-Uid;
    # A variable in the access_log path makes nginx stat the request root; the default
    # /etc/nginx/html does not exist in nginx:alpine and would break logging.
    root /usr/share/nginx/html;
    open_log_file_cache max=16 inactive=60s valid=60s min_uses=1;
    access_log /var/log/nginx/access-$log_day.log analytics;
    limit_req_status 429;
    include /etc/nginx/conf.d/http-server.conf;
    include /etc/nginx/conf.d/https-server.conf;
    include /etc/nginx/conf.d/runner-server.conf;
    # Blue-green only (glob: absent unless slots mode renders it).
    include /etc/nginx/conf.d/slots-private-server*.conf;
}
