# The browser security headers of every response from the app's server blocks (EDGE-04, and the
# header set securityheaders.com grades). ONE snippet, included at server level
# (common.conf.template) and inside every location or `if` that sets an add_header of its own,
# because nginx inherits add_header from an outer level ONLY into a scope with no add_header
# of its own. nginx/tests/forwarded-headers.sh fails if a scope forgets the include.
#
# The values that differ per path come from the maps in nginx.conf (all keyed on $sh_class, the path
# class of the request). An EMPTY map value makes add_header emit nothing: that is how a path
# class omits a header (no CSP on the API, say). The upstream's own copies of every header below
# are removed by the proxy_hide_header lines in nginx.conf, so nginx's value is the only one.
#
#   - Enforced: nosniff, X-Frame-Options, Referrer-Policy, Permissions-Policy, COOP, CORP, HSTS.
#   - Report-only, never enforced here: the Content-Security-Policy and COEP. Violations are read
#     from the browser console / a reporting run, the policy is tuned, and only then proposed as
#     an enforcing header (docs/tls.md "Security headers").
#   - Content-Security-Policy itself is deliberately NOT set or hidden here: the API sets its own
#     on file and SVG responses and on the OAuth consent page, and those must pass through.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $sh_referrer always;
add_header Permissions-Policy $sh_permissions always;
add_header Content-Security-Policy-Report-Only $sh_csp_report_only always;
add_header Cross-Origin-Opener-Policy $sh_coop always;
add_header Cross-Origin-Resource-Policy $sh_corp always;
add_header Cross-Origin-Embedder-Policy-Report-Only $sh_coep_report_only always;
add_header Reporting-Endpoints $sh_reporting_endpoints always;
# Strict-Transport-Security: only when FORCE_HTTPS=true (render-config.sh writes conf.d/hsts.inc then and
# removes it otherwise; a glob with no match is valid, so plain-http installs are unaffected).
include /etc/nginx/conf.d/hsts*.inc;
