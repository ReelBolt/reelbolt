# Client-address headers for every proxied request. Included by the server blocks AND by every
# location that sets a proxy_set_header of its own: nginx inherits proxy_set_header from the
# enclosing level only when a location sets none, so a location that merely blanks or translates
# Authorization would otherwise forward a client-supplied X-Real-IP untouched. The Inference API
# records X-Real-IP as consent evidence.
#
# Deliberately no Host here: the server blocks set `Host $host` inline, and a location with its
# own headers sets it only where the upstream needs the public hostname (the three marketing
# locations and the visit beacon in locations.conf, a list nginx/tests/forwarded-headers.sh pins);
# the others get nginx's default, the upstream's own name.
#
# $remote_addr is the socket peer, or the visitor's address restored from CF-Connecting-IP when
# REAL_IP_FROM_CLOUDFLARE=true and the peer is a Cloudflare edge (cloudflare-realip.conf).
# nginx/tests/forwarded-headers.sh fails if a location sets a header without including this.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# X-ReelBolt-Slot-Fallback is nginx's own signal to the Inference API (slots-locations.conf: the
# assistant turn route sets it to "1" after this include). A client must not be able to send it on
# any other route, in legacy mode, or through a case variant of the turn path, so it is blanked
# here. An empty value sends no header; the turn location's own line after the include still sends "1".
proxy_set_header X-ReelBolt-Slot-Fallback "";
