server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        return 302 /docs/;
    }

    # Docusaurus (trailingSlash: false) emits /docs/foo.html and a /docs/foo/ directory that has no
    # index.html, so a trailing slash falls through to the 404 page. Public links such as
    # /docs/runner/ end in a slash: send them to the page. Relative Location, so the proxy's host
    # and port never leak into it. `rewrite ... permanent` escapes the path and keeps the query string,
    # which `return 301 /docs/$1` would copy back decoded.
    #
    # Other languages are built under /docs/<code>/ (docs/i18n.md). The language switcher links to the
    # locale root /docs/it/, which is a real folder with an index.html: serve it as it is (no
    # redirect hop). There is deliberately NO language auto-redirect in the docs: /docs/ is English,
    # /docs/<code>/ is that language, and the reader picks with the navbar dropdown.
    location ~ "^/docs/[a-z]{2,3}/$" {
        try_files $uri/index.html /docs/404.html;
    }

    location ~ ^/docs/(.+)/$ {
        absolute_redirect off;
        rewrite ^/docs/(.+)/$ /docs/$1 permanent;
    }

    # A translated site has its own 404 page (/docs/<code>/404.html, in that language). Locale roots are
    # matched above, so this only sees /docs/<code>/<page>; a path that is not a locale (an English
    # page whose first folder is two or three letters) finds no <code>/404.html and gets the stock 404.
    location ~ "^/docs/(?<locale>[a-z]{2,3})/." {
        try_files $uri $uri.html $uri/index.html /docs/$locale/404.html =404;
    }

    location /docs/ {
        # Docusaurus emits /docs/foo/index.html (trailingSlash: false also emits /docs/foo.html).
        try_files $uri $uri.html $uri/index.html /docs/404.html;
    }
}
