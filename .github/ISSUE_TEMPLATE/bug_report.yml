name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you run ReelBolt
      options: [Self-hosted (Docker Compose), Self-hosted (other), Hosted at reelbolt.ai]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Contents of the VERSION file, or the commit SHA.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs <service>`. Remove secrets and personal data first.
      render: shell
