name: Runtime image release

# Publishes the Remotion sandbox-runtime image to GHCR as a multi-arch image,
# signs it keylessly with cosign (GitHub OIDC), attaches an SBOM, and opens a
# PR that pins the new digest in sandbox/runtime-image.lock. Runners and cloud
# workers pull by that digest, never by tag. See docs/sandbox-service.md
# "Published runtime image".
#
# Trigger: push a tag `runtime-vMAJOR.MINOR.PATCH` (for example runtime-v1.0.0).

on:
  push:
    tags: ["runtime-v*"]

concurrency:
  group: runtime-image-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, push, sign
    # Upstream only: forks cannot push to this GHCR namespace. `lock-pr` needs `publish`.
    if: github.repository == 'ReelBolt/reelbolt'
    runs-on: ubuntu-latest
    # The `release` environment holds the required reviewer, so publishing an image needs an approval.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#runtime-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not runtime-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR image paths must be lowercase.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reelbolt-sandbox-runtime" >> "$GITHUB_ENV"

      - name: Prepare licence files
        run: infra/scripts/prepare-legal-context.sh "$RUNNER_TEMP/legal"

      # OCI labels and tags, written by a plain step: docker/metadata-action is not on the public repository's
      # allowed-actions list, and one disallowed action fails the whole workflow at startup.
      - name: Image metadata
        id: imgmeta
        env:
          VERSION_OUT: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo 'labels<<__LABELS__'
            echo "org.opencontainers.image.title=reelbolt-sandbox-runtime"
            echo "org.opencontainers.image.description=ReelBolt sandbox runtime (Remotion render environment). ReelBolt code is AGPL-3.0-only. Third-party GPL programs are included (FFmpeg, the Remotion compositor FFmpeg); see /licenses/GPL-SOURCE-OFFER.md"
            echo "org.opencontainers.image.licenses=AGPL-3.0-only"
            echo "org.opencontainers.image.version=${VERSION_OUT}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo '__LABELS__'
            echo 'tags<<__TAGS__'
            echo "${IMAGE}:${VERSION_OUT}"
            echo '__TAGS__'
          } >> "$GITHUB_OUTPUT"

      # The gate: build once locally (linux/amd64, not pushed), check, produce the source bundle.
      # Nothing is pushed unless every check passes.
      - name: Build for the publication gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          target: sandbox-runtime
          platforms: linux/amd64
          build-contexts: legal=${{ runner.temp }}/legal
          push: false
          load: true
          tags: ${{ env.IMAGE }}:gate
          labels: ${{ steps.imgmeta.outputs.labels }}
          sbom: false
          provenance: false
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,scope=runtime-image,mode=max

      - name: Source bundle (gate image)
        run: infra/scripts/gpl-source-bundle.sh --out "$RUNNER_TEMP/bundles" "${IMAGE}:gate"

      - name: Publication gate
        run: infra/scripts/check-image-publish-gate.sh --image "${IMAGE}:gate" --bundle-dir "$RUNNER_TEMP/bundles"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          target: sandbox-runtime
          platforms: linux/amd64,linux/arm64
          build-contexts: legal=${{ runner.temp }}/legal
          push: true
          tags: ${{ steps.imgmeta.outputs.tags }}
          labels: ${{ steps.imgmeta.outputs.labels }}
          # BuildKit attaches an SPDX SBOM and SLSA provenance as OCI
          # attestations on the index, one per platform.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,scope=runtime-image,mode=max

      # The gate above checked linux/amd64 only. Read the pushed linux/arm64 manifest's labels from the
      # registry and its filesystem (licenses, compositor hashes, package versions) WITHOUT running it.
      # Not verified here: arm64 ffmpeg -buildconf (needs an arm64 runner); the Dockerfile guard ran
      # during the arm64 build. Fails before the index is signed.
      - name: Post-push check (linux/arm64)
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: infra/scripts/check-image-publish-gate.sh --post-push "${IMAGE}@${INDEX_DIGEST}" --platform linux/arm64

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the index and each per-architecture manifest
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Platform manifests only: skip BuildKit's unknown/unknown attestation manifests.
          digests="$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --raw \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')"
          for d in "$INDEX_DIGEST" $digests; do
            cosign sign --yes "${IMAGE}@${d}"
          done

      - name: Verify signature (self-check)
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${INDEX_DIGEST}" \
            --certificate-identity-regexp '^https://github.com/ReelBolt/reelbolt/\.github/workflows/runtime-image-release\.yml@refs/tags/runtime-v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # The bundle for the pushed digest itself, kept for the GitHub release of this tag.
      - name: Source bundle (pushed digest)
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: infra/scripts/gpl-source-bundle.sh --out "$RUNNER_TEMP/bundles-published" "${IMAGE}@${INDEX_DIGEST}"

      - name: Upload source bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpl-source-sandbox-runtime
          path: |
            ${{ runner.temp }}/bundles
            ${{ runner.temp }}/bundles-published
          retention-days: 90

  # The written offer (GPL-SOURCE-OFFER.md) promises the source bundle as an asset of the release of
  # the same tag. Creates the release as a prerelease draft if it does not exist yet.
  release-assets:
    name: Attach source bundle to the release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpl-source-sandbox-runtime
          path: bundles

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "$GITHUB_REF_NAME" \
                 --notes "Runtime image release. Corresponding source (GPL-SOURCE-OFFER.md) is attached."
          find bundles -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber

  lock-pr:
    name: Open lockfile PR
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update sandbox/runtime-image.lock and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          branch="bot/runtime-image-${VERSION}"
          jq -n --arg v "$VERSION" --arg d "$DIGEST" '{version: $v, digest: $d}' > sandbox/runtime-image.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sandbox/runtime-image.lock
          git commit -m "chore(sandbox): pin runtime image ${VERSION}"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(sandbox): pin runtime image ${VERSION}" \
            --body "Automated by runtime-image-release. Digest: \`${DIGEST}\`. Verify with cosign before merging."
