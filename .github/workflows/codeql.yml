name: CodeQL

# Code scanning on GitHub-hosted runners (free for public repositories). Fork pull
# requests get a read-only token, so the SARIF upload only happens for same-repo PRs,
# pushes and the weekly schedule; results appear under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# is built (manual) so CodeQL resolves call targets: build-mode none reported "Low analysis quality"
          # (calls with call target 82%, below the 85% bar). The test project is left out of the traced build.
          # Go does not support build-mode none. 'manual' builds the three modules that compile on a plain runner:
          # autobuild would also try the Wails desktop module, which needs gtk4/webkitgtk headers.
          - { language: csharp, build-mode: manual }
          - { language: go, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go must be installed BEFORE codeql-action/init: init puts a tracing `go` shim first on PATH and
      # warns "Expected `which go` to return .../codeql-action-go-tracing/bin/go" when setup-go runs after
      # it, so the manual build is not traced and CodeQL reports "could not process any code written in Go".
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: api/go.mod
          cache: false
      # Same ordering rule for .NET: setup-dotnet before init, so the build is the traced one.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}


      - name: Build the Go modules (CodeQL manual build)
        if: matrix.language == 'go'
        run: |
          for d in api runner sandbox; do
            (cd "$d" && go build ./...)
          done

      # Full, non-incremental build of the shipped projects (Shared comes in as a reference); no build server,
      # so every compile is traced.
      - name: Build the .NET services (CodeQL manual build)
        if: matrix.language == 'csharp'
        run: |
          for p in ReelBolt.Inference.Api ReelBolt.WorkflowEngine ReelBolt.ImportWorker; do
            dotnet build "inference/src/$p/$p.csproj" --no-incremental -p:UseSharedCompilation=false -p:TreatWarningsAsErrors=false
          done

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
