name: CodeQL

# Code scanning on GitHub-hosted runners (free for public repositories). Fork pull
# requests get a read-only token, so the SARIF upload only happens for same-repo PRs,
# pushes and the weekly schedule; results appear under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go does not support build-mode none. 'manual' builds the three modules that compile on a plain runner:
          # autobuild would also try the Wails desktop module, which needs gtk4/webkitgtk headers.
          - { language: csharp, build-mode: none }
          - { language: go, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go must be installed BEFORE codeql-action/init: init puts a tracing `go` shim first on PATH and
      # warns "Expected `which go` to return .../codeql-action-go-tracing/bin/go" when setup-go runs after
      # it, so the manual build is not traced and CodeQL reports "could not process any code written in Go".
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: api/go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}


      - name: Build the Go modules (CodeQL manual build)
        if: matrix.language == 'go'
        run: |
          for d in api runner sandbox; do
            (cd "$d" && go build ./...)
          done

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
