name: Image release

# Publishes the container images for a release tag (v<VERSION>, for example v0.4.0-alpha):
# ghcr.io/<owner>/reelbolt-<name>:<version> and :<sha>, with the BuildKit SBOM and provenance and a
# keyless cosign signature. No floating tag is pushed (alpha policy).
# The image matrix and the publish steps mirror the `docker` / `docker-publish` jobs of ci.yml (YAML
# anchors cannot cross files); infra/scripts/tests/image-release-matrix.test.sh fails when they drift.
# The cosign identity of these images is THIS workflow at the tag ref. See docs/ci.md, "Releasing images".
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# A tag run is never cancelled: a half-published release is worse than a slow one.
concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    # Upstream repository only; any other repository cannot push to its GHCR.
    if: github.repository == 'ReelBolt/reelbolt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match VERSION (expected v${version})"
            exit 1
          fi

      - name: Tagged commit is on the default branch
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main; tag a commit that is on the default branch"
            exit 1
          fi

  publish:
    name: Publish · ${{ matrix.name }}
    needs: verify
    if: github.repository == 'ReelBolt/reelbolt'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go-api
            context: ./api
            file: ./api/Dockerfile
          - name: inference-api
            context: ./inference
            file: ./inference/src/ReelBolt.Inference.Api/Dockerfile
            # Same named context compose supplies: the /docs tree the assistant searches.
            build_contexts: platform-docs=./docs
          - name: docs-site
            context: ./docs-site
            file: ./docs-site/Dockerfile
            target: production
            # The user guide and its translations only: the developer docs are not published (docs/docs-site.md).
            build_contexts: |
              docs=./docs/user-guide
              docs_i18n=./docs/user-guide-i18n
          - name: workflow-engine
            context: ./inference
            file: ./inference/src/ReelBolt.WorkflowEngine/Dockerfile
          - name: web
            context: ./web
            file: ./web/Dockerfile
            target: production
            # Public GA4 ID, inlined into the browser bundle at build time (repository variable,
            # empty = no analytics). Consent gating is in the app.
            # NEXT_PUBLIC_TELEMETRY_ENABLED is the same kind of build-time switch for the app's own
            # funnel events and consent popup (docs/product-events.md): the deployed image is THIS
            # image, so a .env on the host cannot turn it on. Repository variable, empty = off.
            build_args: |
              NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
              NEXT_PUBLIC_TELEMETRY_ENABLED=${{ vars.NEXT_PUBLIC_TELEMETRY_ENABLED }}
              GIT_SHA=${{ github.sha }}
          - name: site
            context: ./site
            file: ./site/Dockerfile
            target: production
            # The Dockerfile bakes this into the bundle at build time. Without it the ARG resolves
            # to the empty string and the image would carry site-config's source default instead of
            # the canonical origin; see docs/marketing-site.md.
            build_args: |
              NEXT_PUBLIC_SITE_URL=https://reelbolt.ai
              NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          - name: mcp
            context: ./mcp
            file: ./mcp/Dockerfile
          - name: sandbox-runtime
            context: ./sandbox
            file: ./sandbox/Dockerfile
            target: sandbox-runtime
            # The runtime image also ships to Apple-silicon / arm64 desktop runners. The arm64
            # half is emulated here; the sandbox-runtime-arm64 job below renders natively.
            platforms: linux/amd64,linux/arm64
          - name: sandbox-executor
            context: ./sandbox
            file: ./sandbox/Dockerfile
            target: control-plane
          - name: runner-gateway
            context: ./sandbox
            file: ./sandbox/Dockerfile
            target: runner-gateway
          - name: worker
            context: ./sandbox
            file: ./sandbox/Dockerfile
            target: worker
          - name: nginx
            context: ./nginx
            file: ./nginx/Dockerfile
          - name: import-worker
            context: ./inference
            file: ./inference/src/ReelBolt.ImportWorker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platforms != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reelbolt-${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Prepare licence files
        run: infra/scripts/prepare-legal-context.sh "$RUNNER_TEMP/legal"

      - name: Image version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        # The verify job already proved the tag is v<VERSION>.
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # OCI labels and tags, written by a plain step: docker/metadata-action is not on the public repository's
      # allowed-actions list, and one disallowed action fails the whole workflow at startup.
      - name: Image metadata
        id: meta
        env:
          NAME: ${{ matrix.name }}
          VERSION_OUT: ${{ steps.version.outputs.version }}
        run: |
          {
            echo 'labels<<__LABELS__'
            echo "org.opencontainers.image.title=reelbolt-${NAME}"
            echo "org.opencontainers.image.description=ReelBolt ${NAME} image. ReelBolt code is AGPL-3.0-only. Third-party GPL programs may be included (FFmpeg, poppler-utils; sandbox images also the Remotion compositor FFmpeg); see /licenses/GPL-SOURCE-OFFER.md"
            echo "org.opencontainers.image.licenses=AGPL-3.0-only"
            echo "org.opencontainers.image.version=${VERSION_OUT}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo '__LABELS__'
            echo 'tags<<__TAGS__'
            echo "${IMAGE}:${VERSION_OUT}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '__TAGS__'
          } >> "$GITHUB_OUTPUT"

      # The gate builds the image once, locally (linux/amd64, not pushed), checks it, and produces its
      # source bundle. Nothing is pushed unless every check passes.
      - name: Build for the publication gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          build-contexts: |
            ${{ matrix.build_contexts }}
            legal=${{ runner.temp }}/legal
          push: false
          load: true
          tags: ${{ env.IMAGE }}:gate
          labels: ${{ steps.meta.outputs.labels }}
          sbom: false
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      - name: Source bundle (gate image)
        run: infra/scripts/gpl-source-bundle.sh --out "$RUNNER_TEMP/bundles" "${IMAGE}:gate"

      - name: Publication gate
        run: infra/scripts/check-image-publish-gate.sh --image "${IMAGE}:gate" --bundle-dir "$RUNNER_TEMP/bundles"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build_args }}
          build-contexts: |
            ${{ matrix.build_contexts }}
            legal=${{ runner.temp }}/legal
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SPDX SBOM and SLSA provenance as OCI attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      # The gate above checked linux/amd64 only. For an image pushed with an arm64 manifest, read that
      # manifest's labels from the registry and its filesystem (licenses, compositor hashes, package
      # versions) WITHOUT running it. Not verified here: arm64 ffmpeg -buildconf (needs an arm64 runner);
      # the Dockerfile guard ran during the arm64 build. Fails before the image is signed.
      - name: Post-push check (linux/arm64)
        if: contains(matrix.platforms, 'linux/arm64')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: infra/scripts/check-image-publish-gate.sh --post-push "${IMAGE}@${DIGEST}" --platform linux/arm64

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The bundle for the pushed digest itself (same pinned packages as the gate image). Kept as a
      # workflow artifact; the release-assets job attaches every bundle to the GitHub release.
      - name: Source bundle (pushed digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: infra/scripts/gpl-source-bundle.sh --out "$RUNNER_TEMP/bundles-published" "${IMAGE}@${DIGEST}"

      - name: Upload source bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpl-source-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/bundles
            ${{ runner.temp }}/bundles-published
          retention-days: 90

  # The written offer (GPL-SOURCE-OFFER.md) promises the source bundles as assets of the release of
  # the same tag. Creates the release as a draft if it does not exist yet.
  release-assets:
    name: Attach source bundles to the release
    needs: publish
    if: github.repository == 'ReelBolt/reelbolt'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gpl-source-*
          path: bundles

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only the bundles of the pushed digests: the gate bundles describe the same build and share asset names.
          mapfile -d '' files < <(find bundles -path '*/bundles-published/*' -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          test "${#files[@]}" -eq 26 || { echo "::error::expected 26 published bundle files, found ${#files[@]}"; exit 1; }
          existing="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          if ! grep -qx "$TAG" <<<"$existing"; then
            flags=(--draft)
            case "$TAG" in *-*) flags+=(--prerelease --latest=false) ;; esac
            gh release create "$TAG" "${flags[@]}" --title "$TAG" --notes "See release notes"
          fi
          gh release upload "$TAG" --clobber "${files[@]}"
