name: Secret scan

# gitleaks, run from the pinned release binary (checksum verified) so no license key or
# third-party action is involved. Scans the full history on every push and pull request,
# on GitHub-hosted runners, with a read-only token. Findings are reported by rule and
# location only (--redact): secret values never reach the log.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Trust boundary: on a pull request the checked-out tree is the contributor's. Everything that can
      # silence a finding (the config allowlist, .gitleaksignore fingerprints, inline gitleaks:allow
      # comments) must therefore come from the BASE commit, never from the PR head. A PR that
      # changes .gitleaks.toml is scanned with the old file; CODEOWNERS review decides the change.
      - name: Take the scan configuration from the trusted commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gitleaks-config"
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" CFG_DIR="$cfg" SOURCE="$GITHUB_WORKSPACE" \
            bash .github/scripts/secret-scan.sh prepare
          echo "GL_CONFIG_DIR=$cfg" >> "$GITHUB_ENV"

      - name: Scan the full history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" CFG_DIR="$GL_CONFIG_DIR" SOURCE="$GITHUB_WORKSPACE" \
            bash .github/scripts/secret-scan.sh scan

  trust-test:
    name: scanner trust-boundary test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: A PR cannot silence the scanner
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" bash .github/scripts/secret-scan-trust-test.sh
