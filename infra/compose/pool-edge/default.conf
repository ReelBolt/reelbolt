# pool-edge: the one door on the media box that on-demand pool nodes may knock on.
#
# Nodes sit on the private network in their own subnet and dial ws://<media private ip>:8091/v1/connect.
# The node token travels inside the protocol hello, so no header is stripped here. Everything except the
# connect path answers 404: the gateway's internal API, metrics, health and telemetry routes are not
# reachable through this listener. Layer 3 isolation of the pool subnet is infra/scripts/pool-isolation.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A hostile node gets a handful of sockets and a slow trickle of new ones.
limit_conn_zone $binary_remote_addr zone=pool_conn:1m;
limit_req_zone  $binary_remote_addr zone=pool_req:1m rate=5r/s;

server {
    listen 8080;
    server_tokens off;
    # A node that opens a socket and goes quiet is cut off quickly (worker_connections is nginx's default).
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Heartbeats are every 15 s and the gateway declares a runner dead after 45 s, so a 120 s idle
    # timeout never cuts a healthy socket.
    location = /v1/connect {
        limit_conn pool_conn 4;
        limit_req zone=pool_req burst=10 nodelay;
        client_max_body_size 1m;
        # Docker's embedded DNS; the variable makes nginx resolve per request, so a gateway that is
        # not up yet does not stop nginx from starting.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://runner-gateway:8090/v1/connect;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway binds the hello to this host: pin it, never take a node's own header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        access_log off;
        default_type text/plain;
        return 404 "not found\n";
    }
}
